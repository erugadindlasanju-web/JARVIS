

<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #050b16;
  color: #e8f7ff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}
.app {
  width: 100%;
  max-width: 500px;
  padding: 25px;
  text-align: center;
}
h1 {
  color: #35d9ff;
  letter-spacing: 8px;
  margin-top: 35px;
}
.status { color: #48e6ad; font-size: 13px; }
.circle {
  width: 170px;
  height: 170px;
  margin: 45px auto;
  border: 2px solid #35d9ff;
  border-radius: 50%;
  box-shadow: 0 0 35px #087fa8;
  display: grid;
  place-items: center;
  font-size: 55px;
}
.chat {
  background: #101d30;
  border: 1px solid #24516b;
  border-radius: 15px;
  padding: 18px;
  min-height: 130px;
  text-align: left;
  overflow-wrap: anywhere;
}
input {
  width: 72%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #35d9ff;
  background: #101d30;
  color: white;
  margin-top: 18px;
}
button {
  padding: 14px;
  background: #087fa8;
  color: white;
  border: none;
  border-radius: 10px;
}
</style>
</head>
<body>
<div class="app">
<h1>J.A.R.V.I.S</h1>
<p class="status">● SYSTEM INITIALIZED</p>
<div class="circle">✧</div>
<h3>PERSONAL AI ASSISTANT</h3>
<div class="chat" id="chat">
<p>JARVIS: Hello! System interface is ready.</p>
</div>
<input id="message" placeholder="Talk to JARVIS...">
<button onclick="sendMessage()">SEND</button>
</div>
<script>
function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  if (!input.value.trim()) return;
  const p = document.createElement("p");
  p.textContent = "YOU: " + input.value;
  chat.appendChild(p);
  const reply = document.createElement("p");
  reply.textContent = "JARVIS: Message received. AI brain coming soon!";
  chat.appendChild(reply);
  input.value = "";
}
</script>
</body>
</html>
